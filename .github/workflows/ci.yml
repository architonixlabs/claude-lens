name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Note: `npm run format:check` is deliberately NOT enforced here. The source
      # uses a compact hand-tuned style (one-line accessors, aligned comments) that
      # Prettier would rewrite across ~37 files. Prettier stays available via
      # `npm run format` for new code; ESLint is the gate that catches real defects.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Smoke stress test (small)
        run: node sim/stress.js 30 5

  # P1 cross-platform check: the launcher and hook installer must work off Windows.
  # The installer writes to a throwaway settings file, so the runner's own config is
  # untouched. We assert idempotency — the property the folder-rename flow relies on.
  hooks-cross-platform:
    name: Hook installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install is idempotent
        run: |
          SETTINGS="$RUNNER_TEMP/settings.json"
          echo '{}' > "$SETTINGS"

          node hooks/install-hooks.mjs --settings="$SETTINGS"
          first=$(grep -c 'claude-hook.mjs' "$SETTINGS")

          node hooks/install-hooks.mjs --settings="$SETTINGS"
          second=$(grep -c 'claude-hook.mjs' "$SETTINGS")

          echo "hook entries — after 1st run: $first, after 2nd: $second"
          test "$first" -gt 0 || { echo 'installer wrote no entries'; exit 1; }
          test "$first" = "$second" || { echo 'installer is not idempotent'; exit 1; }

      - name: Uninstall removes every entry
        run: |
          SETTINGS="$RUNNER_TEMP/settings.json"
          node hooks/install-hooks.mjs --settings="$SETTINGS" --remove
          if grep -q 'claude-hook.mjs' "$SETTINGS"; then
            echo 'uninstall left entries behind'; exit 1
          fi

      - name: Launcher script is syntax-clean
        run: bash -n start.sh
