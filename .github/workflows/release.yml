name: Release

# Builds installers for all three platforms and attaches them to the GitHub
# Release. Each OS must build on its own runner — a macOS .dmg cannot be
# produced from Windows or Linux.
#
# Trigger by pushing a tag (v1.2.3), or manually via workflow_dispatch with the
# tag name. Manual runs are handy for rebuilding assets without re-tagging.
#
# This repository is public, so GitHub-hosted runners are free and unlimited.
# (On a private repo these minutes would bill at Linux 1x / Windows 2x / macOS 10x.)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (AppImage + deb)
            build: npm run dist:linux
          - os: macos-latest
            name: macOS (dmg, x64 + arm64)
            build: npm run dist:mac
          - os: windows-latest
            name: Windows (nsis)
            build: npm run dist:win

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Sanity-gate the release: never ship a build whose tests don't pass.
      - name: Lint + unit tests
        run: npm run lint && npm run test:unit

      # Signing is opt-in. CSC_LINK must be genuinely ABSENT when unsigned —
      # setting it to an empty string makes electron-builder resolve it as a
      # path and fail with "<workspace> not a file", so it is exported only
      # when the secret actually has a value.
      - name: Build installers
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${CSC_LINK_SECRET:-}" ]; then
            echo "signing with the configured certificate"
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="${CSC_KEY_PASSWORD_SECRET:-}"
          else
            echo "no certificate configured — building unsigned"
            # Stop electron-builder grabbing a random macOS keychain identity.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          ${{ matrix.build }}

      - name: List artifacts
        shell: bash
        run: ls -lh dist/ | grep -Ev '^total|unpacked|builder-' || true

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          # Installers, blockmaps, AND the electron-updater feed metadata
          # (latest*.yml) — without the yml files auto-update can't see the release.
          assets=(dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no installer artifacts produced"; exit 1
          fi

          # A tag push creates the tag, not the release. Create it on first use —
          # the three platform jobs race here, so a losing creator is fine as long
          # as the release then exists.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ClaudeLens ${TAG#v}" \
              --notes-file RELEASE.md || true
          fi
          gh release view "$TAG" >/dev/null   # fail loudly if it still isn't there

          printf 'uploading %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber
