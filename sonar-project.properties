# SonarQube project descriptor (Architonix Labs standard — server http://<build-host>:7001).
# Scan from a host that can reach :7001 with SONAR_HOST_URL + SONAR_TOKEN sourced from
# <secrets-file> (never hard-code tokens).
sonar.projectKey=architonix_claude-multiagent-visualization
sonar.projectName=Claude Multi-Agent Visualization
sonar.sources=server,public/js,sim,hooks
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.js
sonar.exclusions=public/vendor/**,node_modules/**,playwright-report/**,test-results/**
sonar.sourceEncoding=UTF-8
