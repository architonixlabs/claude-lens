# SonarQube project descriptor.
#
# Supply the server URL and token from your environment — never hard-code them here.
# If your SonarQube is only reachable on an internal network, run the scanner from a
# host on that network (or a self-hosted runner) rather than from cloud CI:
#
#   export SONAR_HOST_URL=...  SONAR_TOKEN=...     # from your own secret store
#   docker run --rm -v "$PWD:/usr/src" \
#     -e SONAR_HOST_URL -e SONAR_TOKEN sonarsource/sonar-scanner-cli
sonar.projectKey=architonix_claude-lens
sonar.projectName=ClaudeLens
sonar.projectVersion=0.1.0
sonar.sources=server,public/js,sim,hooks
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.js,tests/**/*.test.mjs
sonar.exclusions=public/vendor/**,node_modules/**,playwright-report/**,test-results/**,data/**
sonar.sourceEncoding=UTF-8

# server/redact.js and tests/redact.test.mjs intentionally contain credential-shaped
# patterns and synthetic sample keys — they are detection rules and fixtures, not secrets.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e1.resourceKey=server/redact.js
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/redact.test.mjs
